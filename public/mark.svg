<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 88" role="img" aria-label="HabitaBull">
  <title>HabitaBull</title>
  <!--
    A front-facing bull head: a shield with eye cuts, and two tapered horns
    that sweep out and up to points. Horns are separate paths mirrored about
    x=50 so both sides are exactly symmetric; the head carries the eyes as
    evenodd holes. Muzzle is blunt on purpose — a pointed one reads as a fox.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <path d="M50 26 C43 26 38 27 35 30 C32 33 30 37 30 43 C29 39 25 39 23 42 C26 43 29 44 31 47 C33 54 35 60 39 65 C43 70 47 73 50 73 C53 73 57 70 61 65 C65 60 67 54 69 47 C71 44 74 43 77 42 C75 39 71 39 70 43 C70 37 68 33 65 30 C62 27 57 26 50 26 Z M43 46 C39 45 36 48 38 51 C42 50 45 48 45 46 Z M57 46 C61 45 64 48 62 51 C58 50 55 48 55 46 Z"/>
    <path d="M38 28 C28 21 15 15 10 6 C7 11 6 19 9 26 C14 31 24 34 34 32 C35 31 37 30 38 28 Z"/>
    <path transform="translate(100,0) scale(-1,1)" d="M38 28 C28 21 15 15 10 6 C7 11 6 19 9 26 C14 31 24 34 34 32 C35 31 37 30 38 28 Z"/>
  </g>
</svg>
