<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" role="img" aria-label="HabitaBull">
  <title>HabitaBull</title>
  <!--
    Head front-on, horns sweeping out and UP.

    Construction: the skull is one rounded mass on the vertical axis; each horn
    leaves the skull at its widest point (y=46), sweeps outward and down
    slightly, then turns up to a point. One horn is drawn and mirrored about
    x=50.

    Why the tips point up. The superseded mark (mark-v1-superseded.svg) curled
    both tips inward and let the bases meet at centre; rendered below 48px the
    pair fused into a single bowl and read as a smile, not a bull. Outward,
    upward tips keep two separate silhouettes at every size, and the skull
    holds the centre so the gap never closes.

    Symmetric on purpose — the illustrated mascot is a three-quarter view and
    a stamp has to be square-on or it reads as a mistake when small.
  -->
  <g fill="currentColor">
    <path d="M50 28 C62 28 70 34 70 44 C70 60 61 73 50 73 C39 73 30 60 30 44 C30 34 38 28 50 28 Z"/>
    <path d="M32 46 C21 47 11 42 5 32 C1 25 0 15 3 8 C8 19 15 27 25 31 C29 33 32 36 33 39 Z"/>
    <path d="M68 46 C79 47 89 42 95 32 C99 25 100 15 97 8 C92 19 85 27 75 31 C71 33 68 36 67 39 Z"/>
  </g>
</svg>
